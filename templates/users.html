{% extends "base.html" %}{% block content %}<div class="card"><h2>Nový uživatel</h2><form method="post" class="form-grid"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="create"><label>Jméno<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Heslo<input type="password" name="password" minlength="8" required></label><label>Role<select name="role"><option>user</option><option>admin</option><option>superadmin</option></select></label><button>Vytvořit</button></form></div><div class="card"><h2>Uživatelé</h2><div class="content-list">{% for row in rows %}<div class="admin-user-row"><div><span class="badge type">{{ row.role }}</span><span class="badge status {{ row.status }}">{{ row.status }}</span></div><div><strong>{{ row.name }}</strong><small>{{ row.email }} · #{{ row.id }}</small></div><div class="row-actions"><a class="btn small secondary" href="?page=impersonate&id={{ row.id }}">Přepnout se</a><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="user_id" value="{{ row.id }}"><input type="hidden" name="action" value="toggle_status"><button class="small secondary">Zap./vyp.</button></form><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="user_id" value="{{ row.id }}"><input type="hidden" name="action" value="set_role"><select name="role"><option {{ 'selected' if row.role=='user' else '' }}>user</option><option {{ 'selected' if row.role=='admin' else '' }}>admin</option><option {{ 'selected' if row.role=='superadmin' else '' }}>superadmin</option></select><button class="small secondary">Role</button></form><details><summary class="btn small secondary">Heslo</summary><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="user_id" value="{{ row.id }}"><input type="hidden" name="action" value="reset_password"><input type="password" name="password" minlength="8" placeholder="Nové heslo"><button class="small">Nastavit</button></form></details></div></div>{% else %}<div class="empty">Žádní uživatelé.</div>{% endfor %}</div></div>{% endblock %}
