{% extends "base.html" %}{% block content %}<div class="account-grid"><div class="card"><h2>Účet</h2><form method="post" class="friendly-form"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="account_action" value="profile"><label>Jméno<input name="name" value="{{ account.name or '' }}" required></label><label>E-mail<input type="email" name="email" value="{{ account.email or '' }}" required></label><label>Nové heslo <small>(nech prázdné beze změny)</small><input type="password" name="password" minlength="8"></label><button>Uložit účet</button></form><small>Role: {{ account.role }}</small></div><div class="card"><h2>Oznámení Lindy</h2><p class="muted">In-app upozornění fungují vždy. E-mailové preference zůstávají kompatibilní s původní Lindou a budou použity, pokud je na serveru aktivní mail transport.</p><form method="post" class="preference-form37"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="account_action" value="notifications"><label><input type="checkbox" name="email_group_done" value="1" {{ 'checked' if preferences.email_group_done else '' }}> E-mail po dokončení celé aktivity / dávky</label><label><input type="checkbox" name="email_failed" value="1" {{ 'checked' if preferences.email_failed else '' }}> E-mail, když Linda opakovaně selže</label><label><input type="checkbox" name="email_plan_ready" value="1" {{ 'checked' if preferences.email_plan_ready else '' }}> E-mail, když je plán připraven ke schválení</label><label><input type="checkbox" name="email_media_batch" value="1" {{ 'checked' if preferences.email_media_batch else '' }}> E-mail po dávce obrázků</label><button class="secondary">Uložit oznámení</button></form></div></div>{% endblock %}
